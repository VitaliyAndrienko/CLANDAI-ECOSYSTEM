<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>CLANDAI · UI KIT v2</title>
<style>
:root{
  --bg:#08090b;--panel:rgba(20,22,26,.55);--border:rgba(0,255,170,.18);
  --neon:#00ffaa;--neon-dim:#00ffaa55;--cyan:#00d9ff;--cyan-dim:#00d9ff55;
  --pink:#ff2bd6;--pink-dim:#ff2bd655;--text:#d8dee6;--muted:#5b6672;
  --danger:#ff3b6b;--danger-dim:#ff3b6b55;--gold:#ffd400;--purple:#a855f7;
  --radius:14px;
  --icon-color:#00ffaa;
  --icon-color-dim:rgba(0,255,170,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;
  font-size:13px;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent}
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(1000px 500px at 15% 0%,var(--neon-dim),transparent 60%),
    radial-gradient(700px 400px at 100% 100%,rgba(255,43,214,.05),transparent 60%);
  pointer-events:none;z-index:0;opacity:.15}
body::after{content:'';position:fixed;inset:0;
  background-image:linear-gradient(var(--neon-dim) 1px,transparent 1px),
    linear-gradient(90deg,var(--neon-dim) 1px,transparent 1px);
  background-size:42px 42px;pointer-events:none;z-index:0;opacity:.06;
  -webkit-mask-image:radial-gradient(circle at 50% 40%,black,transparent 85%);
  mask-image:radial-gradient(circle at 50% 40%,black,transparent 85%)}

.app{position:relative;z-index:1;max-width:1180px;margin:0 auto;
  padding:22px 18px 60px;display:flex;flex-direction:column;gap:14px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px;flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:3px;font-size:16px;opacity:.9}
.logo b{color:var(--neon);text-shadow:0 0 14px var(--neon-dim)}
.topbar-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.icon-btn{background:transparent;border:1px solid var(--border);color:var(--text);
  width:34px;height:34px;border-radius:9px;cursor:pointer;display:grid;place-items:center;
  transition:border-color .15s,color .15s;flex-shrink:0;padding:0}
.icon-btn:hover{border-color:var(--neon);color:var(--neon)}
.icon-btn svg{width:15px;height:15px}

.color-control{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;
  background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:9px;
  transition:border-color .15s}
.color-control:hover{border-color:var(--neon)}
.color-control label{font-size:9px;letter-spacing:1.5px;color:var(--muted);
  text-transform:uppercase;cursor:pointer}
#global-color{width:34px;height:34px;padding:0;border:none;background:transparent;
  cursor:pointer;border-radius:7px;overflow:hidden}
#global-color::-webkit-color-swatch-wrapper{padding:0}
#global-color::-webkit-color-swatch{border:1px solid var(--border);border-radius:6px}

.hero{text-align:center;padding:6px 0 2px}
.hero h1{font-size:18px;letter-spacing:4px;color:var(--neon);
  text-shadow:0 0 20px var(--neon-dim);margin-bottom:8px}
.hero p{color:var(--muted);font-size:11.5px;line-height:1.7;letter-spacing:.5px}

.main-tabs{display:flex;gap:4px;background:rgba(0,0,0,.4);padding:4px;
  border:1px solid var(--border);border-radius:12px;max-width:640px;
  margin:6px auto 0;width:100%;flex-wrap:wrap}
.main-tab{flex:1;min-width:70px;padding:11px 6px;background:transparent;border:none;
  color:var(--muted);font-family:inherit;font-size:10.5px;letter-spacing:1.5px;
  text-transform:uppercase;cursor:pointer;border-radius:8px;
  transition:all .18s;font-weight:700}
.main-tab:hover{color:var(--text)}
.main-tab.active{background:var(--icon-color-dim);color:var(--icon-color);
  box-shadow:inset 0 0 14px -4px var(--icon-color),0 0 14px -4px var(--icon-color-dim)}

.color-presets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:2px 0 6px}
.preset-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;position:relative;transition:all .15s;flex-shrink:0}
.preset-swatch:hover{transform:scale(1.12)}
.preset-swatch.active{border-color:#fff;box-shadow:0 0 14px currentColor}
.preset-swatch::after{content:'';position:absolute;inset:-3px;border-radius:50%;
  border:1px dashed rgba(255,255,255,.15);pointer-events:none}

.search-box{position:relative;max-width:520px;margin:0 auto;width:100%}
.search-box input{width:100%;padding:12px 16px 12px 42px;
  background:rgba(20,22,26,.7);border:2px solid var(--neon-dim);
  border-radius:30px;color:var(--text);font-family:inherit;font-size:12px;
  letter-spacing:1px;outline:none;backdrop-filter:blur(14px);
  transition:all .3s ease;box-shadow:0 0 15px -5px var(--neon-dim)}
.search-box input:focus{border-color:var(--neon);
  box-shadow:0 0 25px var(--neon-dim),inset 0 0 10px var(--neon-dim)}
.search-box input::placeholder{color:var(--muted);text-transform:uppercase;
  letter-spacing:2px;font-size:10px}
.search-box svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--neon);pointer-events:none;
  filter:drop-shadow(0 0 6px var(--neon))}

.cats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:4px 0 8px}
.cat-btn{padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.4);
  border:1px solid var(--border);color:var(--muted);font-family:inherit;
  font-size:10px;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;
  transition:all .15s;font-weight:700;white-space:nowrap}
.cat-btn:hover{border-color:var(--neon);color:var(--neon)}
.cat-btn.active{background:var(--icon-color-dim);border-color:var(--icon-color);
  color:var(--icon-color);box-shadow:0 0 14px -4px var(--icon-color)}

.stats-row{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;
  font-size:10px;letter-spacing:1.5px;color:var(--muted);
  text-transform:uppercase;padding:4px 0}
.stats-row b{color:var(--icon-color);font-weight:700;font-variant-numeric:tabular-nums}

.section{margin-top:10px}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;
  padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.05)}
.section-head h2{font-size:11px;letter-spacing:3px;color:var(--icon-color);
  text-transform:uppercase;text-shadow:0 0 12px var(--icon-color-dim);font-weight:700}
.section-head .badge{font-size:9px;letter-spacing:1.5px;color:var(--muted);
  padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.4);
  border:1px solid var(--border);font-weight:700}
.section-head .line{flex:1;height:1px;
  background:linear-gradient(90deg,var(--icon-color-dim),transparent)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.grid-wide{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.grid-recipe{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}

.icon-card{position:relative;
  background:linear-gradient(135deg,rgba(0,255,170,.03),rgba(0,0,0,.3));
  border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;
  display:flex;flex-direction:column;gap:10px;
  transition:border-color .2s,background .25s,transform .15s,box-shadow .2s;
  overflow:hidden}
.icon-card:hover{border-color:var(--icon-color);
  background:linear-gradient(135deg,rgba(0,255,170,.08),rgba(0,0,0,.35));
  transform:translateY(-2px);box-shadow:0 0 26px -10px var(--icon-color)}
.icon-card:active{transform:translateY(0) scale(.99)}
.icon-card.copied{border-color:var(--cyan);
  background:linear-gradient(135deg,rgba(0,217,255,.1),rgba(0,0,0,.35));
  box-shadow:0 0 22px -8px var(--cyan)}

.ic-top{display:flex;align-items:center;gap:12px}
.ic-preview{width:46px;height:46px;flex-shrink:0;border-radius:11px;
  display:grid;place-items:center;
  background:radial-gradient(circle at 30% 30%,var(--icon-color-dim),rgba(0,0,0,.45));
  border:1px solid var(--icon-color-dim);color:var(--icon-color);
  position:relative;overflow:hidden;
  transition:color .25s,background .25s,border-color .25s}
.ic-preview::after{content:'';position:absolute;inset:0;border-radius:11px;
  background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.08) 50%,transparent 60%);
  pointer-events:none}
.ic-preview svg{width:24px;height:24px;position:relative;z-index:1}

.ic-info{flex:1;min-width:0}
.ic-name{font-size:11px;color:var(--text);font-weight:700;letter-spacing:.5px;
  text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic-key{font-size:9px;color:var(--icon-color);letter-spacing:1px;margin-top:3px;
  font-family:inherit;opacity:.85;transition:color .25s}
.ic-desc{font-size:10px;color:var(--muted);line-height:1.5;letter-spacing:.3px}

.ic-tag{position:absolute;top:8px;right:8px;font-size:8px;letter-spacing:1px;
  font-weight:700;padding:2px 6px;border-radius:5px;
  background:rgba(0,0,0,.5);border:1px solid var(--border);color:var(--muted);
  text-transform:uppercase;opacity:0;transition:opacity .2s}
.icon-card:hover .ic-tag{opacity:1}
.ic-tag.tag-new{color:var(--cyan);border-color:rgba(0,217,255,.4);
  background:rgba(0,217,255,.08)}
.ic-tag.tag-used{color:var(--icon-color);border-color:var(--icon-color-dim);
  background:rgba(0,255,170,.08)}
.ic-tag.tag-recipe{color:var(--gold);border-color:rgba(255,212,0,.4);
  background:rgba(255,212,0,.08);opacity:1}

.comp-card{position:relative;
  background:linear-gradient(135deg,rgba(0,255,170,.03),rgba(0,0,0,.3));
  border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;
  display:flex;flex-direction:column;gap:12px;overflow:hidden;
  transition:border-color .2s,background .25s,transform .15s,box-shadow .2s}
.comp-card:hover{border-color:var(--icon-color);
  background:linear-gradient(135deg,rgba(0,255,170,.06),rgba(0,0,0,.32));
  transform:translateY(-2px);box-shadow:0 0 26px -10px var(--icon-color)}
.comp-card.copied{border-color:var(--cyan);
  background:linear-gradient(135deg,rgba(0,217,255,.1),rgba(0,0,0,.35))}

.comp-preview{
  background:rgba(0,0,0,.4);border:1px dashed rgba(255,255,255,.06);
  border-radius:10px;padding:16px;min-height:70px;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;flex-wrap:wrap;gap:8px}
.comp-preview.dark{background:#05060a;border-style:solid;border-color:var(--border)}
.comp-preview.modal-preview{padding:12px;background:#05060a;border-style:solid}
.comp-preview.recipe-preview{
  background:transparent;border:none;padding:0;
  align-items:stretch;justify-content:stretch;flex-direction:column}

.comp-info{display:flex;flex-direction:column;gap:4px;min-width:0}
.comp-name{font-size:11px;color:var(--text);font-weight:700;letter-spacing:.5px;
  text-transform:uppercase}
.comp-key{font-size:9px;color:var(--icon-color);letter-spacing:1px;
  font-family:inherit;opacity:.85}
.comp-desc{font-size:10px;color:var(--muted);line-height:1.5;letter-spacing:.3px}

.empty{text-align:center;padding:40px 20px;color:var(--muted);
  font-size:12px;letter-spacing:1px}

.toast{position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(100px);
  background:#0e1014;border:1px solid var(--icon-color);color:var(--icon-color);
  padding:12px 20px;border-radius:999px;font-size:12px;letter-spacing:1px;
  z-index:200;opacity:0;transition:transform .25s cubic-bezier(.2,.8,.2,1),
  opacity .25s,color .25s,border-color .25s;
  box-shadow:0 0 24px var(--icon-color-dim);max-width:90vw;text-align:center;
  font-family:inherit}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{border-color:var(--danger);color:var(--danger)}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--icon-color-dim);border-radius:8px}

@media (max-width:640px){
  body::after{display:none}
  .app{padding:16px 12px 40px;gap:10px}
  .grid,.grid-wide,.grid-recipe{grid-template-columns:1fr;gap:8px}
  .ic-preview{width:38px;height:38px;border-radius:9px}
  .ic-preview svg{width:20px;height:20px}
  .ic-name{font-size:10px}
  .ic-desc{font-size:9px}
  .hero h1{font-size:15px;letter-spacing:3px}
  .color-control label{display:none}
  .main-tab{font-size:9px;padding:8px 4px;letter-spacing:1px}
}
</style>
</head>
<body>

<div class="app">

  <div class="topbar">
    <div class="logo">CLAN<b>DAI</b> · UI KIT</div>
    <div class="topbar-actions">
      <div class="color-control">
        <label for="global-color">COLOR</label>
        <input type="color" id="global-color" value="#00ffaa"/>
      </div>
      <button class="icon-btn" id="btn-copy-all" title="Скопировать всё">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="hero">
    <h1>UI KIT · v2</h1>
    <p>Иконки · Кнопки · Поля · Окна · Рецепты (комбо-блоки)<br>
       Клик = копировать · цвет пикера меняет ВСЁ</p>
  </div>

  <div class="main-tabs">
    <button class="main-tab active" data-tab="icons">ИКОНКИ</button>
    <button class="main-tab" data-tab="buttons">КНОПКИ</button>
    <button class="main-tab" data-tab="fields">ПОЛЯ</button>
    <button class="main-tab" data-tab="modals">ОКНА</button>
    <button class="main-tab" data-tab="recipes">РЕЦЕПТЫ</button>
  </div>

  <div class="color-presets" id="color-presets"></div>

  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
    </svg>
    <input id="search-input" type="text" placeholder="Поиск по названию, описанию или ключу..." autocomplete="off"/>
  </div>

  <div class="stats-row">
    <span>ВСЕГО: <b id="stat-total">0</b></span>
    <span>·</span>
    <span>ПОКАЗАНО: <b id="stat-show">0</b></span>
  </div>

  <div class="cats" id="cats"></div>

  <div id="sections"></div>

</div>

<div class="toast" id="toast"></div>

<script>

  { key:'merge', name:'Merge', desc:'Слияние', tag:'new', path:`<circle cx="19" cy="12" r="2.5"/><circle cx="5" cy="6" r="2.5"/><circle cx="5" cy="18" r="2.5"/><path d="M7.5 6l9 6"/><path d="M7.5 18l9-6"/>` },

d:transparent;border:1px solid var(--danger);color:var(--danger);font-weight:700">ОТКЛОНИТЬ</button><button style="padding:12px;border-radius:10px;font-family:inherit;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;background:linear-gradient(180deg,var(--neon-dim),transparent);border:1px solid var(--neon);color:var(--neon);font-weight:700">ПОДПИСАТЬ</button></div></div>` },

/* ================= RENDER ================= */
const state = {
  tab: 'icons',
  search: '',
  activeCat: 'all',
  globalColor: '#00ffaa',
};

const PRESET_COLORS = [
  { name: 'NEON', value: '#00ffaa' },
  { name: 'CYAN', value: '#00d9ff' },
  { name: 'PINK', value: '#ff2bd6' },
  { name: 'PURPLE', value: '#a855f7' },
  { name: 'GOLD', value: '#ffd400' },
  { name: 'ORANGE', value: '#ff9a3c' },
  { name: 'RED', value: '#ff3b6b' },
  { name: 'BLUE', value: '#3b82f6' },
  { name: 'GREEN', value: '#22c55e' },
  { name: 'WHITE', value: '#ffffff' },
];

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function toast(msg, err=false){
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(el._h);
  el._h = setTimeout(() => el.className = 'toast', 1800);
}
function buildSvg(path){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
}
function fullSvgCode(ic){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ic.path}</svg>`;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function hexToRgba(hex, a){
  const h = hex.replace('#','');
  const r = parseInt(h.substr(0,2),16);
  const g = parseInt(h.substr(2,2),16);
  const b = parseInt(h.substr(4,2),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ==== COLOR PROPAGATION: --neon, --border, etc. all follow global color ==== */
function applyGlobalColor(hex){
  state.globalColor = hex;
  const root = document.documentElement.style;
  root.setProperty('--icon-color', hex);
  root.setProperty('--icon-color-dim', hexToRgba(hex, .3));
  root.setProperty('--neon', hex);
  root.setProperty('--neon-dim', hexToRgba(hex, .33));
  root.setProperty('--border', hexToRgba(hex, .18));
  $$('.preset-swatch').forEach(el => {
    el.classList.toggle('active', el.dataset.color.toLowerCase() === hex.toLowerCase());
  });
}

function renderPresets(){
  const wrap = $('#color-presets');
  wrap.innerHTML = '';
  PRESET_COLORS.forEach(c => {
    const el = document.createElement('div');
    el.className = 'preset-swatch' + (c.value.toLowerCase() === state.globalColor.toLowerCase() ? ' active' : '');
    el.dataset.color = c.value;
    el.style.background = c.value;
    el.style.color = c.value;
    el.title = c.name;
    el.onclick = () => {
      applyGlobalColor(c.value);
      $('#global-color').value = c.value;
      toast('🎨 ' + c.name);
    };
    wrap.appendChild(el);
  });
}

function getItems(tab = state.tab){
  const out = [];
  if (tab === 'icons') ICON_DATA.forEach(cat => cat.icons.forEach(ic => out.push({ ...ic, cat: cat.cat })));
  if (tab === 'buttons') BUTTON_DATA.forEach(cat => cat.items.forEach(ic => out.push({ ...ic, cat: cat.cat })));
  if (tab === 'fields') FIELD_DATA.forEach(cat => cat.items.forEach(ic => out.push({ ...ic, cat: cat.cat })));
  if (tab === 'modals') MODAL_DATA.forEach(cat => cat.items.forEach(ic => out.push({ ...ic, cat: cat.cat })));
  if (tab === 'recipes') RECIPE_DATA.forEach(cat => cat.items.forEach(ic => out.push({ ...ic, cat: cat.cat })));
  return out;
}

async function copyToClipboard(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch{
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try{ document.execCommand('copy'); ok = true; }catch{}
    ta.remove();
    return ok;
  }
}

function render(){
  const all = getItems();
  $('#stat-total').textContent = all.length;

  const catMap = new Map();
  all.forEach(it => { catMap.set(it.cat, (catMap.get(it.cat) || 0) + 1); });
  const catList = ['all', ...catMap.keys()];
  const catsEl = $('#cats');
  catsEl.innerHTML = '';
  catList.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (state.activeCat === cat ? ' active' : '');
    btn.textContent = cat === 'all' ? 'ВСЕ' : cat;
    btn.onclick = () => { state.activeCat = cat; render(); };
    catsEl.appendChild(btn);
  });

  const q = state.search.toLowerCase().trim();
  const filtered = all.filter(it => {
    if (state.activeCat !== 'all' && it.cat !== state.activeCat) return false;
    if (!q) return true;
    return (it.name + ' ' + it.desc + ' ' + it.key + ' ' + it.cat).toLowerCase().includes(q);
  });

  $('#stat-show').textContent = filtered.length;

  const wrap = $('#sections');
  wrap.innerHTML = '';

  if (!filtered.length){
    wrap.innerHTML = '<div class="empty">Ничего не найдено</div>';
    return;
  }

  const grouped = {};
  filtered.forEach(ic => {
    if (!grouped[ic.cat]) grouped[ic.cat] = [];
    grouped[ic.cat].push(ic);
  });

  Object.entries(grouped).forEach(([cat, icons]) => {
    const sec = document.createElement('div');
    sec.className = 'section';
    let gridClass = 'grid';
    if (state.tab === 'fields' || state.tab === 'modals' || state.tab === 'buttons') gridClass = 'grid-wide';
    if (state.tab === 'recipes') gridClass = 'grid-recipe';
    sec.innerHTML = `
      <div class="section-head">
        <h2>${escapeHtml(cat)}</h2>
        <span class="badge">${icons.length}</span>
        <span class="line"></span>
      </div>
      <div class="${gridClass}"></div>
    `;
    const grid = sec.querySelector('.' + gridClass);

    icons.forEach(ic => {
      if (state.tab === 'icons') grid.appendChild(buildIconCard(ic));
      else grid.appendChild(buildComponentCard(ic, state.tab));
    });

    wrap.appendChild(sec);
  });
}

function buildIconCard(ic){
  const card = document.createElement('div');
  card.className = 'icon-card';
  card.innerHTML = `
    <span class="ic-tag ${ic.tag === 'new' ? 'tag-new' : 'tag-used'}">${ic.tag === 'new' ? 'NEW' : 'USED'}</span>
    <div class="ic-top">
      <div class="ic-preview">${buildSvg(ic.path)}</div>
      <div class="ic-info">
        <div class="ic-name">${escapeHtml(ic.name)}</div>
        <div class="ic-key">${escapeHtml(ic.key)}</div>
      </div>
    </div>
    <div class="ic-desc">${escapeHtml(ic.desc)}</div>
  `;
  card.addEventListener('click', async () => {
    const ok = await copyToClipboard(fullSvgCode(ic));
    if (ok){
      card.classList.add('copied');
      toast('✓ SVG скопирован: ' + ic.key);
      setTimeout(() => card.classList.remove('copied'), 700);
    } else toast('Ошибка копирования', true);
    if (navigator.vibrate) navigator.vibrate(8);
  });
  return card;
}

function buildComponentCard(ic, tab){
  const card = document.createElement('div');
  card.className = 'comp-card';
  let previewClass = 'comp-preview dark';
  if (tab === 'modals') previewClass = 'comp-preview modal-preview';
  if (tab === 'recipes') previewClass = 'comp-preview recipe-preview';
  card.innerHTML = `
    <div class="${previewClass}">${ic.html}</div>
    <div class="comp-info">
      <div class="comp-name">${escapeHtml(ic.name)}</div>
      <div class="comp-key">${escapeHtml(ic.key)}</div>
      <div class="comp-desc">${escapeHtml(ic.desc)}</div>
    </div>
  `;
  card.addEventListener('click', async (e) => {
    e.stopPropagation();
    const ok = await copyToClipboard(ic.html);
    if (ok){
      card.classList.add('copied');
      toast('✓ HTML скопирован: ' + ic.key);
      setTimeout(() => card.classList.remove('copied'), 700);
    } else toast('Ошибка копирования', true);
    if (navigator.vibrate) navigator.vibrate(8);
  });
  return card;
}

$$('.main-tab').forEach(tab => {
  tab.onclick = () => {
    state.tab = tab.dataset.tab;
    state.activeCat = 'all';
    $$('.main-tab').forEach(t => t.classList.toggle('active', t === tab));
    render();
  };
});

$('#search-input').addEventListener('input', e => {
  state.search = e.target.value;
  render();
});

$('#global-color').addEventListener('input', e => {
  applyGlobalColor(e.target.value);
});

$('#btn-copy-all').addEventListener('click', async () => {
  const all = getItems();
  let out = '';
  if (state.tab === 'icons'){
    out = all.map(ic => `/* ${ic.key} — ${ic.name} (${ic.cat}) */\n${fullSvgCode(ic)}`).join('\n\n');
  } else {
    out = all.map(ic => `/* ${ic.key} — ${ic.name} (${ic.cat}) */\n${ic.html}`).join('\n\n');
  }
  const ok = await copyToClipboard(out);
  toast(ok ? ('✓ Всё скопировано (' + all.length + ')') : 'Ошибка копирования', !ok);
  if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
});

applyGlobalColor(state.globalColor);
renderPresets();
render();
</script>
</body>
</html>
